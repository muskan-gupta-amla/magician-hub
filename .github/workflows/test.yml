# Runs the hub's tests (simulated GitHub and Jira, no secrets needed) on every push and pull request.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/popups.test.js test/hosted.test.js test/tools.test.js test/jira-token.test.js
